name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  repository: read

env:
  # Fall back on any proxy error so hosted runners are not tied to one endpoint.
  GOPROXY: "https://goproxy.cn|https://mirrors.aliyun.com/goproxy/|direct"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run --disable=errcheck --disable=staticcheck

  test:
    name: Test
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Validate release version script
        run: bash scripts/test-release-version-validation.sh

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: upload-artifact
        with:
          name: coverage-linux-${{ atomgit.run_id }}
          path: coverage.out

  build:
    name: Build
    runs-on: [codearts-hosted, ubuntu-latest, x64, small]
    needs:
      - test
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p bin
          go build -ldflags "${LDFLAGS}" -o bin/gc ./cmd/gc
          bin/gc version

      - name: Upload binary
        uses: upload-artifact
        with:
          name: gc-ubuntu-${{ atomgit.run_id }}
          path: bin/gc

  docker:
    name: Docker
    runs-on: [codearts-hosted, ubuntu-latest, x64, medium]
    needs:
      - test
    steps:
      - name: Checkout
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.22"

      - name: Generate completions
        run: |
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o gc ./cmd/gc
          mkdir -p gc_cli/bin
          cp gc gc_cli/bin/gc-linux-amd64

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t gitcode/gc:latest .

      - name: Wheel entrypoint smoke test
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist/
          python -m pip install dist/*.whl
          echo "=== gc version ===" && gc version
          echo "=== gitcode version ===" && gitcode version
          echo "=== python -m gc_cli version ===" && python -m gc_cli version
