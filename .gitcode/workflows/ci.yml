name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  repository: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: [ubuntu-24, x64, small]
    steps:
      - uses: checkout

      - uses: setup-go
        with:
          go-version: "1.22"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --disable=errcheck --disable=staticcheck

  test:
    name: Test
    runs-on: [ubuntu-24, x64, small]
    steps:
      - uses: checkout

      - uses: setup-go
        with:
          go-version: "1.22"

      - name: Validate release version script
        run: bash scripts/test-release-version-validation.sh

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: upload-artifact
        with:
          name: coverage-linux
          path: coverage.out

  build:
    name: Build
    runs-on: [ubuntu-24, x64, small]
    needs:
      - test
    steps:
      - uses: checkout

      - uses: setup-go
        with:
          go-version: "1.22"

      - name: Build
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p bin
          go build -ldflags "${LDFLAGS}" -o bin/gc ./cmd/gc
          bin/gc version

      - name: Upload binary
        uses: upload-artifact
        with:
          name: gc-ubuntu
          path: bin/gc

  docker:
    name: Docker
    runs-on: [ubuntu-24, x64, medium]
    needs:
      - test
    steps:
      - uses: checkout

      - uses: setup-go
        with:
          go-version: "1.22"

      - name: Generate completions
        run: |
          go build -o /tmp/gc ./cmd/gc
          mkdir -p completions
          /tmp/gc completion bash > completions/gc.bash
          /tmp/gc completion zsh > completions/gc.zsh
          /tmp/gc completion fish > completions/gc.fish

      - name: Build binary
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o gc ./cmd/gc
          mkdir -p gc_cli/bin
          cp gc gc_cli/bin/gc-linux-amd64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gitcode/gc:latest
          platforms: linux/amd64

      - name: Wheel entrypoint smoke test
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist/
          python -m pip install dist/*.whl
          echo "=== gc version ===" && gc version
          echo "=== gitcode version ===" && gitcode version
          echo "=== python -m gc_cli version ===" && python -m gc_cli version
